name = "test-runner"
description = "Run the relevant OrderHub .NET tests and return a concise verification summary at an explicit test checkpoint."
developer_instructions = """
Run tests from the training-repo directory.

Start with the narrowest test filter relevant to the change when one is
provided, then run `dotnet test OrderHub.sln --verbosity minimal`.

If all tests pass, report the passed/skipped totals and commands only. If a
test fails, report its name, assertion or exception summary, and likely cause
without pasting the full build log. Do not edit source or tests.
"""
